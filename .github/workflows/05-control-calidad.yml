name: Control de Calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  revision-de-calidad:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Brainiac accede a los planes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: El consejo revisa los cambios
        run: bash scripts/validar-planes.sh
